a{color:var(--crema)}
main{max-width:560px;margin:0 auto;padding:0 20px 40px}
.osw{font-family:Oswald,'Arial Narrow',sans-serif}
.etq{font:500 14px Oswald,'Arial Narrow',sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--menta);margin:0}
.tit{font:700 38px/1.03 Montserrat,sans-serif;letter-spacing:-.005em;margin:6px 0 0;color:var(--crema)}
.tit.chico{font-size:28px}
.linea{display:block;width:64px;height:5px;border-radius:1px;background:linear-gradient(90deg,#A8D7AD,#C9E9C3);margin:14px 0 18px}
.bajada{font-size:18px;line-height:1.3;color:rgba(251,246,241,.95);margin:0}
h2.sec{font:500 14px Oswald,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--menta);margin:30px 0 10px}
header.top{max-width:560px;margin:0 auto;padding:26px 20px 8px;display:flex;align-items:center;gap:12px}
header.top img.logo{height:69px;width:auto;display:block}
header.top.c img.logo{height:52px}
.prueba{background:var(--rosa);color:var(--crema);text-align:center;font:600 13px Oswald,sans-serif;letter-spacing:.08em;padding:6px;text-transform:uppercase}
.hero{padding:16px 0 6px}
.panel{background:var(--panel);border:1px solid var(--borde);border-radius:20px;padding:18px;margin:14px 0;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.fila{display:flex;gap:11px;align-items:center;padding:16px 0;border-top:1px solid rgba(251,246,241,.22);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left;color:inherit;font:inherit}
.fila:first-child{border-top:0}
.fila:disabled{cursor:default;opacity:.62}
.chipdia{flex:none;min-width:70px;height:36px;border-radius:18px;background:var(--chip);color:var(--crema);font:600 16px Oswald,sans-serif;letter-spacing:.06em;display:flex;align-items:center;justify-content:center;padding:0 12px}
.sepv{width:2px;align-self:stretch;background:rgba(251,246,241,.85);margin:4px 0;flex:none}
.fila .tx{flex:1;min-width:0}
.fila .obra{font:800 17px/1.2 Montserrat,sans-serif;text-transform:uppercase;letter-spacing:.01em}
.fila .meta{font-size:14px;color:var(--suave);margin-top:2px}
.fila .estado{display:inline-block;font:600 12px Oswald,sans-serif;letter-spacing:.06em;text-transform:uppercase;margin-top:6px;padding:2px 10px;border-radius:99px}
.estado.ok{background:rgba(168,215,173,.18);color:var(--menta)}.estado.pocos{background:rgba(246,104,91,.22);color:#ffd2cc}.estado.agotado,.estado.cerrada{background:rgba(251,246,241,.12);color:var(--suave)}
.poster{width:58px;height:58px;border-radius:12px;object-fit:cover;flex:none;background:rgba(251,246,241,.1)}
.funs{display:grid;gap:20px}
.cardf{--fondo:#4B1739;position:relative;background:var(--fondo);border-radius:24px;overflow:hidden;border:1px solid var(--borde);cursor:pointer;box-shadow:0 14px 34px rgba(30,5,20,.35);-webkit-tap-highlight-color:transparent}
.cardf.apagada{cursor:default}

  function dona(partes, total, centro, sub) {
    var NS = 'http://www.w3.org/2000/svg', R = 70, C = 2 * Math.PI * R;

      c.setAttribute('stroke', color); c.setAttribute('stroke-width', ancho || 26);

    var t2 = document.createElementNS(NS, 'text'); t2.setAttribute('x', 90); t2.setAttribute('y', 116); t2.setAttribute('class', 'dona-s'); t2.textContent = sub;
    svg.appendChild(t1); svg.appendChild(t2);

  }
